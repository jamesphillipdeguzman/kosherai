        fill="#064e3b" opacity="0.5" />
        
  <!-- Thyroid / Pure Salt Crystal / Leaf Emblem -->
  <!-- Left Wing / Leaf -->
  <path d="M256 250 C230 200, 170 180, 160 220 C150 260, 200 310, 256 340 Z" fill="url(#grad2)" />
  <!-- Right Wing / Leaf -->
  <path d="M256 250 C282 200, 342 180, 352 220 C362 260, 312 310, 256 340 Z" fill="url(#grad2)" />
  <!-- Central Pure Salt Crystal Cross -->
